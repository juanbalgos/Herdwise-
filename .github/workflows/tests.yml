name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: herdwise_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d herdwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:pPZ5YF8s7+vp0H+ON8ZAo10mw9Yi68mgRqqWLA3j6Wo=
      APP_DEBUG: false
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_DATABASE: herdwise_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, pdo_pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PostgreSQL migrations
        run: php artisan migrate:fresh --force

      - name: Run test suite
        run: php artisan test --compact

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction
